# git-cliff configuration — https://git-cliff.org/docs/configuration
#
# Changelog strategy (see README.md > Changelog):
#   - One MINOR release per completed ROADMAP phase, tagged `v0.X.0`.
#   - Per-task granularity comes from Conventional Commits, not from tags.
#
# Regenerate the changelog with:
#   git cliff --output CHANGELOG.md

[changelog]
header = """
# Changelog\n
All notable changes to this project are documented in this file.\n
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}\
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | trim | upper_first }}
    {% endfor -%}
{% endfor %}\n
"""
footer = """
<!-- Generated by git-cliff. Do not edit manually — run `git cliff --output CHANGELOG.md`. -->
"""
trim = true

[git]
# Parse commits using the Conventional Commits specification.
conventional_commits = true
# Never silently drop commits that do not follow the convention; they land in "Other".
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^build", group = "<!-- 6 -->Build" },
  { message = "^ci", group = "<!-- 7 -->CI" },
  { message = "^chore", group = "<!-- 8 -->Chore" },
  { message = "^revert", group = "<!-- 9 -->Revert" },
  { message = ".*", group = "<!-- 10 -->Other" },
]
# A breaking change must never be hidden by a filtering parser.
protect_breaking_commits = true
filter_commits = false
# Tags look like v0.1.0, v0.2.0, ... (one per completed phase).
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
